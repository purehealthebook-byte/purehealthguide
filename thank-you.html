<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — PureHealthGuide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --black: #0a0a0a; --near-black: #141414; --white: #f5f5f3;
    --dim: #9a9a95; --red: #c8291f; --red-glow: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px; width: 100%;
    background: var(--near-black);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 48px 36px;
    text-align: center;
  }
  .check {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(200,41,31,0.15); color: var(--red);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 24px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px; margin-bottom: 12px; letter-spacing: -0.01em;
  }
  p { color: var(--dim); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 26px; font-size: 15px; font-weight: 600; border-radius: 4px;
    text-decoration: none; border: none; cursor: pointer;
    background: var(--red); color: var(--white);
    transition: background .2s;
    width: 100%; justify-content: center;
  }
  .btn:hover { background: var(--red-glow); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 12px; color: #6b6b66; margin-top: 18px; }
  a.back { color: var(--dim); font-size: 13px; text-decoration: none; display: inline-block; margin-top: 28px; }
  a.back:hover { color: var(--white); }
</style>
</head>
<body>

  <div class="card">
    <div class="check">✓</div>
    <h1 id="title">Checking your order…</h1>
    <p id="message">Give us a second while we confirm your payment with PayPal.</p>

    <button class="btn" id="download-btn" disabled>Preparing your download…</button>
    <p class="note">The download link expires 10 minutes after it's generated — if it stops working, just refresh this page to get a new one.</p>

    <a href="index.html" class="back">← Back to PureHealthGuide</a>
  </div>

<script>
  var SUPABASE_URL = "https://zarasbzkxjlsiydniitk.supabase.co";
  var FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  var SUPABASE_ANON_KEY = "sb_publishable_3lDfYDfblJDSnh62F8wHSQ_c789CdX5";

  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('message');
  var btn = document.getElementById('download-btn');

  var params = new URLSearchParams(window.location.search);
  var orderID = params.get('order');

  if (!orderID) {
    titleEl.textContent = "No order found";
    msgEl.textContent = "It looks like you reached this page without completing a purchase.";
    btn.style.display = 'none';
  } else {
    fetch(FUNCTIONS_BASE + '/get-download-link', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ orderID: orderID })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.url) {
          titleEl.textContent = "Thank you for your purchase!";
          msgEl.textContent = "Your copy of Never Age Again is ready.";
          btn.disabled = false;
          btn.textContent = "Download the ebook (PDF)";
          btn.onclick = function () { window.location.href = data.url; };
        } else {
          titleEl.textContent = "We couldn't verify this order";
          msgEl.textContent = data.error || "If you just paid, wait a few seconds and refresh this page.";
          btn.style.display = 'none';
        }
      })
      .catch(function () {
        titleEl.textContent = "Something went wrong";
        msgEl.textContent = "Please refresh this page. If it keeps happening, contact us with your order ID: " + orderID;
        btn.style.display = 'none';
      });
  }
</script>

</body>
</html>
