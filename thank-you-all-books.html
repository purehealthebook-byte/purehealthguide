<script>
  var SUPABASE_URL = "https://zarasbzkxjlsiydniitk.supabase.co";
  var FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
  var SUPABASE_ANON_KEY = "sb_publishable_3lDfYDfblJDSnh62F8wHSQ_c789CdX5";

  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('message');
  var waitBtn = document.getElementById('download-wait');
  var listEl = document.getElementById('download-list');

  var params = new URLSearchParams(window.location.search);
  var orderID = params.get('order');

  if (!orderID) {
    titleEl.textContent = "No order found";
    msgEl.textContent = "It looks like you reached this page without completing a purchase.";
    waitBtn.style.display = 'none';
  } else {
    fetch(FUNCTIONS_BASE + '/get-download-link', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ orderID: orderID })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.files && data.files.length) {
          titleEl.textContent = "Thank you for your purchase!";
          msgEl.textContent = "All " + data.files.length + " guides are ready. Tap each one to download — the links work for 30 minutes.";
          waitBtn.style.display = 'none';
          data.files.forEach(function (file) {
            var a = document.createElement('a');
            a.className = 'btn btn-primary dl-btn';
            a.href = file.url;
            a.textContent = file.label;
            listEl.appendChild(a);
          });
        } else {
          titleEl.textContent = "We couldn't verify this order";
          msgEl.textContent = data.error || "If you just paid, wait a few seconds and refresh this page.";
          waitBtn.style.display = 'none';
        }
      })
      .catch(function () {
        titleEl.textContent = "Something went wrong";
        msgEl.textContent = "Please refresh this page. If it keeps happening, contact us with your order ID: " + orderID;
        waitBtn.style.display = 'none';
      });
  }
</script>

<script>
  // Visual state only: mirrors whatever the order check above writes into #title.
  (function () {
    var card = document.getElementById('ty-card');
    var title = document.getElementById('title');
    var celebrated = false;
    function sync() {
      var t = title.textContent;
      var state = /^Checking/.test(t) ? 'loading' : /^Thank you/.test(t) ? 'success' : 'error';
      card.setAttribute('data-state', state);
      if (state === 'success' && !celebrated) {
        celebrated = true;
        if (window.celebrate) window.celebrate();
        else window.addEventListener('load', function () { window.celebrate && window.celebrate(); });
      }
    }
    new MutationObserver(sync).observe(title, { childList: true, characterData: true, subtree: true });
    sync();
  })();
</script>
