<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — PureHealthGuide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --black: #0a0a0a; --near-black: #141414; --white: #f5f5f3;
    --dim: #9a9a95; --red: #c8291f; --red-glow: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px; width: 100%;
    background: var(--near-black);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 48px 36px;
    text-align: center;
  }
  .check {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(200,41,31,0.15); color: var(--red);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 24px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px; margin-bottom: 12px; letter-spacing: -0.01em;
  }
  p { color: var(--dim); font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 26px; font-size: 15px; font-weight: 600; border-radius: 4px;
    text-decoration: none; border: none; cursor: pointer;
    background: var(--red); color: var(--white);
    transition: background .2s;
    width: 100%; justify-content: center;
  }
  .btn:hover { background: var(--red-glow); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 12px; color: #6b6b66; margin-top: 18px; }
  a.back { color: var(--dim); font-size: 13px; text-decoration: none; display: inline-block; margin-top: 28px; }
  a.back:hover { color: var(--white); }
</style>
</head>
<body>

  <div class="card">
    <div class="check">✓</div>
    <h1 id="title">Checking your order…</h1>
    <p id="message">Give us a second while we confirm your payment with PayPal.</p>

    <button class="btn" id="download-btn" disabled>Preparing your download…</button>

    <a href="index.html" class="back">← Back to PureHealthGuide</a>
  </div>

<script>
  // One click triggers both files. We stagger them slightly and use a
  // hidden download link (rather than window.location) because most
  // browsers block a second window.location change fired immediately
  // after the first — but they generally allow a couple of quick,
  // separate <a download> clicks instead.
  var FILE_1 = "https://zarasbzkxjlsiydniitk.supabase.co/storage/v1/object/public/ebooks/kitchen-magic.pdf";
  var FILE_2 = "https://zarasbzkxjlsiydniitk.supabase.co/storage/v1/object/public/ebooks/kitchen-magic-bonus.pdf";

  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('message');
  var btn = document.getElementById('download-btn');

  titleEl.textContent = "Thank you for your purchase!";
  msgEl.textContent = "Your copy of Kitchen Magic — plus the bonus recipe book — is ready.";
  btn.disabled = false;
  btn.textContent = "Download Kitchen Magic (2 files)";

  function triggerDownload(url) {
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  btn.onclick = function () {
    triggerDownload(FILE_1);
    setTimeout(function () { triggerDownload(FILE_2); }, 600);
    btn.textContent = "Downloading both files…";
    setTimeout(function () { btn.textContent = "Download again"; }, 2000);
  };
</script>

</body>
</html>
